name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Tests
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v

      - name: Verify CLI
        run: python -m agents_keys --help-json

  notify:
    name: Discord
    needs: [test]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Post failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL unset on this repo; skipping Discord notify"
            exit 0
          fi
          python3 <<'PY'
          import json, os, sys, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          wf = os.environ["GITHUB_WORKFLOW"]
          ref = os.environ["GITHUB_REF_NAME"]
          url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          payload = {"content": f"**{repo}** `{wf}` failed on `{ref}`\n{url}"}
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=15).read()
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"::warning::Discord webhook HTTP {exc.code}: {body or exc.reason}")
              sys.exit(1)
          PY
